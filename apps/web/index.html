    <meta property="og:title" content="SINTAKS: Portal Pembelajaran" />
    <meta
      property="og:description"
      content="SINTAKS, portal pembelajaran kampus untuk materi, tugas, kuis daring, diskusi, dan rekap nilai."
    />
    <title>SINTAKS: Portal Pembelajaran</title>
    <script>
      try {
        var savedTheme = window.localStorage.getItem('sintaks-theme');
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', '#131a17');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
